name: Build KUTUMAS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Use Gradle to build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleRelease
        env:
          MY_KEYSTORE: keystore.jks
          MY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          MY_KEY_PASSWORD: ${{ secrets.KEY_PASS }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kutumas-release-apk
          path: app/build/outputs/apk/release/*.apk
